query GetCharacters($page: Int) {
  characters(page: $page) {
    info {
      ...InfoDetails
    }
    results {
      ...CharacterDetails
    }
  }
}

fragment InfoDetails on Info {
  count
  pages
  next
  prev
}

fragment CharacterDetails on Character {
  id
  name
  status
  species
  type
  gender
  image
  origin {
    name
    id
  }
  location {
    name
    id
  }
  episode {
    id
  }
  created
}
