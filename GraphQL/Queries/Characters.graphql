query GetCharacters($page: Int) {
  characters(page: $page) {
    info {
      count
      pages
      next
      prev
    }
    results {
      id
      name
      status
      species
      type
      gender
      image
      origin {
        name
        id
      }
      location {
        name
        id
      }
      episode {
        id
      }
      created
    }
  }
}
